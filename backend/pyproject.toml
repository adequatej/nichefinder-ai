[project]
name = "nichefinder-backend"
version = "0.1.0"
description = "NicheFinder AI backend: FastAPI service, YouTube ingestion, and niche analytics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "langdetect>=1.0.9",
    "apscheduler>=3.10",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "umap-learn>=0.5",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
