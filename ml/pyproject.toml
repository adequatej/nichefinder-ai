[project]
name = "nichefinder-ml"
version = "0.1.0"
description = "NicheFinder AI breakout prediction model: dataset export, labels, features, training, evaluation"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "pandas>=2.2",
    "pyarrow>=14",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "torch>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
